name: Sungrow Modbus to MQTT
slug: sungrowmod2mqtt
description: Unofficial Sungrow hybrid inverter Modbus TCP → MQTT bridge. Not affiliated with Sungrow.
version: 0.2.0
image: ghcr.io/ypsilontm/homeassistant-addons/addon-sungrowmod2mqtt
url: https://github.com/YpsilonTM/homeassistant-addons
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
services:
  - mqtt:want
options:
  modbus_host: ""
  modbus_port: 502
  modbus_unit_id: 1
  modbus_timeout_seconds: 10.0
  poll_interval_seconds: 10.0
  slow_poll_multiplier: 6
  allow_writes: false
  enable_ems_writes: false
  legacy_modqtt_compat: false
  mqtt_host: null
  mqtt_port: null
  mqtt_username: null
  mqtt_password: null
  mqtt_client_id: sungrowmod2mqtt-addon
  topic_prefix: sungrowmod2mqtt
  device_name: Sungrow Inverter
  log_level: INFO
schema:
  modbus_host: str
  modbus_port: int(1,65535)
  modbus_unit_id: int(0,255)
  modbus_timeout_seconds: float(0,120)
  poll_interval_seconds: float(1,3600)
  slow_poll_multiplier: int(1,60)
  allow_writes: bool
  enable_ems_writes: bool
  legacy_modqtt_compat: bool
  mqtt_host: str?
  mqtt_port: int?
  mqtt_username: str?
  mqtt_password: password?
  mqtt_client_id: str
  topic_prefix: str
  device_name: str
  log_level: list(DEBUG|INFO|WARNING|ERROR)
