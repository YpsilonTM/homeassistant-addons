name: Sigen EV Local to MQTT
slug: sigenevlocal2mqtt
description: Unofficial local NearTerminal bridge for Sigen EV AC. Not affiliated with Sigenergy. May affect warranty or mySigen Terms of Service.
version: 0.2.0
image: ghcr.io/ypsilontm/homeassistant-addons/addon-sigenevlocal2mqtt
url: https://github.com/YpsilonTM/homeassistant-addons
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
services:
  - mqtt:want
options:
  charger_host: ""
  charger_port: 21319
  poll_interval_seconds: 5
  slow_poll_multiplier: 4
  min_current: 6
  max_current: 16
  enable_dangerous_commands: false
  mqtt_host: null
  mqtt_port: null
  mqtt_username: null
  mqtt_password: null
  mqtt_client_id: sigenevlocal2mqtt-addon
  topic_prefix: sigen_evac_local
  device_name: Sigen EV AC Local
  log_level: INFO
schema:
  charger_host: str
  charger_port: int(1,65535)
  poll_interval_seconds: int(2,300)
  slow_poll_multiplier: int(1,60)
  min_current: int(6,32)
  max_current: int(6,32)
  enable_dangerous_commands: bool
  mqtt_host: str?
  mqtt_port: int?
  mqtt_username: str?
  mqtt_password: password?
  mqtt_client_id: str
  topic_prefix: str
  device_name: str
  log_level: list(DEBUG|INFO|WARNING|ERROR)
