name: Sigen EV Cloud to MQTT
slug: sigenevcloud2mqtt
description: Sigenergy cloud bridge for Sigen EV AC – current, start/stop, status, telemetry, and phase mode via MQTT for Home Assistant
version: 0.2.6
image: ghcr.io/ypsilontm/hassaddons/addon-sigenevcloud2mqtt
url: https://github.com/YpsilonTM/hassaddons
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
map:
  - data:rw
options:
  username: ""
  password: ""
  region: eu
  poll_interval_seconds: 15
  min_current: 6
  max_current: 16
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_client_id: sigenevcloud2mqtt-addon
  topic_prefix: sigen_evac
  device_name: Sigen EV AC
  log_level: INFO
schema:
  username: str
  password: password
  region: list(eu|apac|us|cn)
  poll_interval_seconds: int(5,300)
  min_current: int(6,32)
  max_current: int(6,32)
  mqtt_host: str
  mqtt_port: int
  mqtt_username: str
  mqtt_password: password
  mqtt_client_id: str
  topic_prefix: str
  device_name: str
  log_level: list(DEBUG|INFO|WARNING|ERROR)
