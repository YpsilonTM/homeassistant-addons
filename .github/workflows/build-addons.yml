name: Build and Push Add-on Images

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      push:
        description: Push images to GHCR
        required: false
        type: boolean
        default: true
      addon:
        description: Add-on to build (blank = all add-ons)
        required: false
        type: choice
        options:
          - ""
          - modqtt
          - ocppsigen2mqtt
          - sigenevcloud2mqtt
          - sigenevlocal2mqtt
          - sungrowmod2mqtt
  push:
    branches:
      - main
      - master
    tags:
      - v*
    paths:
      - modqtt/**
      - ocppsigen2mqtt/**
      - sigenevcloud2mqtt/**
      - sigenevlocal2mqtt/**
      - sungrowmod2mqtt/**
      - .github/workflows/build-addons.yml
  pull_request:
    paths:
      - modqtt/**
      - ocppsigen2mqtt/**
      - sigenevcloud2mqtt/**
      - sigenevlocal2mqtt/**
      - sungrowmod2mqtt/**
      - .github/workflows/build-addons.yml

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      modqtt: ${{ steps.filter.outputs.modqtt }}
      ocppsigen2mqtt: ${{ steps.filter.outputs.ocppsigen2mqtt }}
      sigenevcloud2mqtt: ${{ steps.filter.outputs.sigenevcloud2mqtt }}
      sigenevlocal2mqtt: ${{ steps.filter.outputs.sigenevlocal2mqtt }}
      sungrowmod2mqtt: ${{ steps.filter.outputs.sungrowmod2mqtt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            modqtt:
              - 'modqtt/**'
              - '.github/workflows/build-addons.yml'
            ocppsigen2mqtt:
              - 'ocppsigen2mqtt/**'
              - '.github/workflows/build-addons.yml'
            sigenevcloud2mqtt:
              - 'sigenevcloud2mqtt/**'
              - '.github/workflows/build-addons.yml'
            sigenevlocal2mqtt:
              - 'sigenevlocal2mqtt/**'
              - '.github/workflows/build-addons.yml'
            sungrowmod2mqtt:
              - 'sungrowmod2mqtt/**'
              - '.github/workflows/build-addons.yml'

  prepare:
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        shell: bash
        run: |
          add_item() {
            if [ -n "$items" ]; then
              items+=","
            fi
            items+="{\"slug\":\"$1\",\"image\":\"$2\"}"
          }

          items=""
          event="${{ github.event_name }}"
          selected="${{ github.event.inputs.addon }}"

          if [ "$event" = "workflow_dispatch" ]; then
            if [ -z "$selected" ]; then
              add_item modqtt addon-modqtt
              add_item ocppsigen2mqtt addon-ocppsigen2mqtt
              add_item sigenevcloud2mqtt addon-sigenevcloud2mqtt
              add_item sigenevlocal2mqtt addon-sigenevlocal2mqtt
              add_item sungrowmod2mqtt addon-sungrowmod2mqtt
            else
              case "$selected" in
                modqtt) add_item modqtt addon-modqtt ;;
                ocppsigen2mqtt) add_item ocppsigen2mqtt addon-ocppsigen2mqtt ;;
                sigenevcloud2mqtt) add_item sigenevcloud2mqtt addon-sigenevcloud2mqtt ;;
                sigenevlocal2mqtt) add_item sigenevlocal2mqtt addon-sigenevlocal2mqtt ;;
                sungrowmod2mqtt) add_item sungrowmod2mqtt addon-sungrowmod2mqtt ;;
              esac
            fi
          else
            if [ "${{ needs.changes.outputs.modqtt }}" = "true" ]; then
              add_item modqtt addon-modqtt
            fi
            if [ "${{ needs.changes.outputs.ocppsigen2mqtt }}" = "true" ]; then
              add_item ocppsigen2mqtt addon-ocppsigen2mqtt
            fi
            if [ "${{ needs.changes.outputs.sigenevcloud2mqtt }}" = "true" ]; then
              add_item sigenevcloud2mqtt addon-sigenevcloud2mqtt
            fi
            if [ "${{ needs.changes.outputs.sigenevlocal2mqtt }}" = "true" ]; then
              add_item sigenevlocal2mqtt addon-sigenevlocal2mqtt
            fi
            if [ "${{ needs.changes.outputs.sungrowmod2mqtt }}" = "true" ]; then
              add_item sungrowmod2mqtt addon-sungrowmod2mqtt
            fi
          fi

          if [ -z "$items" ]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$items]}" >> "$GITHUB_OUTPUT"
          fi

  lint-test:
    needs: changes
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.addon == '' ||
           github.event.inputs.addon == 'sigenevcloud2mqtt' ||
           github.event.inputs.addon == 'sigenevlocal2mqtt' ||
           github.event.inputs.addon == 'sungrowmod2mqtt'))
        || needs.changes.outputs.sigenevcloud2mqtt == 'true'
        || needs.changes.outputs.sigenevlocal2mqtt == 'true'
        || needs.changes.outputs.sungrowmod2mqtt == 'true'
      }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slug: [sigenevcloud2mqtt, sigenevlocal2mqtt, sungrowmod2mqtt]
    defaults:
      run:
        working-directory: ${{ matrix.slug }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check src tests

      - name: Pytest
        run: pytest

  docker:
    needs:
      - prepare
      - lint-test
    # When only other add-ons change, lint-test is skipped and docker still runs.
    # When sigenevcloud2mqtt is in scope, docker waits for lint-test success.
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.prepare.result == 'success' &&
        fromJSON(needs.prepare.outputs.matrix).include[0] != null &&
        (needs.lint-test.result == 'success' || needs.lint-test.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read add-on version
        id: addon
        shell: bash
        run: |
          echo "version=$(python - <<'PY'
          from pathlib import Path
          import yaml

          config = yaml.safe_load(Path('${{ matrix.slug }}/config.yaml').read_text(encoding='utf-8'))
          print(config['version'])
          PY
          )" >> "$GITHUB_OUTPUT"

      - name: Set image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.addon.outputs.version }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.slug }}
          file: ./${{ matrix.slug }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}
